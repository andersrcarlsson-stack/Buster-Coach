<p class="nav"><a href="index.html">← Contents</a></p>
<h1>Keys</h1>
<table border="1" cellspacing="0">
<thead>
<tr>
<th>Key</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>Ctrl+N</td>
<td>new game as White</td>
</tr>
<tr>
<td>Ctrl+Z</td>
<td>take back</td>
</tr>
<tr>
<td>Ctrl+O / Ctrl+S</td>
<td>open a game / save the game</td>
</tr>
<tr>
<td>H</td>
<td>hint</td>
</tr>
<tr>
<td>T</td>
<td>show the threat</td>
</tr>
<tr>
<td>Space</td>
<td>play through the move under the box</td>
</tr>
<tr>
<td>← →</td>
<td>one move back / forward</td>
</tr>
<tr>
<td>Home / End</td>
<td>the start / back to the game (Esc too)</td>
</tr>
<tr>
<td>Ctrl+Q</td>
<td>quit</td>
</tr>
</tbody>
</table>
